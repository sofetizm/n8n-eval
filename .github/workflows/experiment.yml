name: Experiment

# Runs the demo agent in three versions against a real LLM and builds the report.
# Needs the GROQ_API_KEY secret. If a daily LLM limit stops it, run it again later:
# finished runs are restored from the cache (also from the previous run) and only the rest is sent.
on:
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
      N8N_URL: http://localhost:5678
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/cache/restore@v4
        with:
          path: examples/bookstore/results
          key: experiment-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            experiment-${{ github.run_id }}-
            experiment-
      - name: Start n8n
        run: |
          docker run -d --name n8n --network host -e N8N_SECURE_COOKIE=false -e N8N_LISTEN_ADDRESS=0.0.0.0 \
            -e N8N_DIAGNOSTICS_ENABLED=false -e N8N_PERSONALIZATION_ENABLED=false docker.n8n.io/n8nio/n8n:2.46.4
      - run: n8n-eval up --workflows examples/bookstore/workflows/*.json --credentials examples/bookstore/credentials.json
      - run: examples/bookstore/run_experiment.sh
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: examples/bookstore/results
          key: experiment-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: examples/bookstore/results
      - if: failure()
        run: docker logs n8n | tail -100
