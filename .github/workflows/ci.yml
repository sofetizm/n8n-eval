name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  e2e:
    needs: test
    runs-on: ubuntu-latest
    env:
      N8N_TEST_URL: http://127.0.0.1:5678
      N8N_URL: http://127.0.0.1:5678
      MOCK_LLM_URL: http://127.0.0.1:8100/v1
      LLM_API_KEY: mock
      LLM_BASE_URL: http://127.0.0.1:8100/v1
      JUDGE_BASE_URL: http://127.0.0.1:8100/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Start a mock LLM with tool calling
        run: nohup uvicorn tests.mock_llm:app --host 127.0.0.1 --port 8100 > mock.log 2>&1 &
      - name: Start n8n
        run: |
          docker run -d --name n8n --network host -e N8N_SECURE_COOKIE=false -e N8N_LISTEN_ADDRESS=0.0.0.0 \
            -e N8N_DIAGNOSTICS_ENABLED=false -e N8N_PERSONALIZATION_ENABLED=false docker.n8n.io/n8nio/n8n:2.46.4
      - name: End-to-end tests on a real n8n
        run: pytest -q tests/test_e2e.py
      - name: Import the demo workflows
        run: n8n-eval up --workflows examples/bookstore/workflows/*.json --credentials examples/bookstore/credentials.json
      - name: CLI on the demo suite
        run: |
          n8n-eval run examples/bookstore/suite.yaml --label mock --repeats 2 --tag orders --out results/mock.jsonl
          n8n-eval gate examples/bookstore/suite.yaml results/mock.jsonl
      - if: failure()
        run: |
          docker logs n8n 2>&1 | tail -80
          tail -30 mock.log
