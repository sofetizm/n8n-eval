[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "n8n-eval"
version = "0.1.0"
description = "Regression tests for n8n AI workflows: repeated runs, LLM judge, cost tracing and a CI quality gate"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Sofya Babkina" }]
dependencies = ["httpx>=0.27", "pyyaml>=6.0", "numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.9", "fastapi>=0.110", "uvicorn>=0.29", "matplotlib>=3.8"]

[project.scripts]
n8n-eval = "n8n_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/n8n_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["n8n: needs a running n8n (N8N_TEST_URL)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]
