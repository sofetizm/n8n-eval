name: n8n-eval
description: Regression tests for n8n AI workflows — repeated runs, LLM judge, cost tracing and a quality gate
branding:
  icon: check-circle
  color: green
inputs:
  suite:
    description: Path to the suite YAML
    required: true
  workflows:
    description: Workflow JSON files to import into a fresh n8n (space-separated, globs allowed)
    default: ""
  credentials:
    description: Credentials JSON; ${VAR} is replaced from the environment
    default: ""
  label:
    description: Name of this run
    default: candidate
  out:
    description: Results JSONL (default results/<suite>/<label>.jsonl)
    default: ""
  baseline:
    description: Results JSONL to compare with (regression gate)
    default: ""
  gate:
    description: Apply the suite's gate and fail the job if it is not met
    default: "true"
  repeats:
    description: Override the number of repeats
    default: ""
  n8n-version:
    description: n8n Docker image tag; empty to use an n8n you started yourself
    default: "2.46.4"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install --quiet "${{ github.action_path }}"
    - if: inputs.n8n-version != ''
      shell: bash
      run: |
        docker run -d --name n8n-eval --network host \
          -e N8N_SECURE_COOKIE=false -e N8N_LISTEN_ADDRESS=0.0.0.0 -e N8N_DIAGNOSTICS_ENABLED=false -e N8N_PERSONALIZATION_ENABLED=false \
          docker.n8n.io/n8nio/n8n:${{ inputs.n8n-version }}
    - if: inputs.workflows != ''
      shell: bash
      run: |
        n8n-eval up --workflows ${{ inputs.workflows }} \
          ${{ inputs.credentials != '' && format('--credentials {0}', inputs.credentials) || '' }}
    - shell: bash
      run: |
        n8n-eval run "${{ inputs.suite }}" --label "${{ inputs.label }}" \
          ${{ inputs.out != '' && format('--out {0}', inputs.out) || '' }} \
          ${{ inputs.repeats != '' && format('--repeats {0}', inputs.repeats) || '' }} \
          ${{ inputs.baseline != '' && format('--baseline {0}', inputs.baseline) || '' }} \
          ${{ inputs.gate == 'true' && '--gate' || '' }}
